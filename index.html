<html>
<head>
  <title>FlexDash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">FlexDash</div>

    <div class="search-bar">
      <input type="text" placeholder="Search dashboard..." />
    </div>

    <div class="user">👤 Admin</div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <ul>
        <li>Dashboard</li>
        <li>Analytics</li>
        <li>Users</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </aside>

    <section class="content">
      <div class="cards">
        <div class="card">Users<br><strong>1,240</strong></div>
        <div class="card">Revenue<br><strong>₹2.4L</strong></div>
        <div class="card">Orders<br><strong>320</strong></div>
      </div>

      <div class="stats">
        <div class="stat blue">Growth<br><strong>+18%</strong></div>
        <div class="stat blue">Conversion<br><strong>5.4%</strong></div>
      </div>
    </section>
  </main>
</body>
</html>
